## -----------------------------------------------
## Basic Configuration
## -----------------------------------------------

title = "Evanna Ientile — Avocate en droit des affaires à Lyon"
baseURL = "https://www.ientile-avocat.fr/"
languageCode = "fr-FR"
defaultContentLanguage = "fr"

## -----------------------------------------------
## Hugo Built-in Features
## -----------------------------------------------

disableKinds = ["taxonomy", "term"]

## -----------------------------------------------
## Site Parameters
## -----------------------------------------------

[Params]
  description = "Evanna Ientile, avocate au Barreau de Lyon. Conseil et contentieux en droit des affaires, droit des sociétés, baux commerciaux."
  logo = "images/logo-Evanna-Ientile-avocate-Lyon.jpg"
  favicon = true
  AuthorName = "Evanna Ientile"

  # Coordonnées — utilisées dans le header, le footer et les données structurées.
  phone = "+33621777773"
  phoneDisplay = "06 21 77 77 73"
  address = "185 rue Duguesclin, 69003 Lyon"
  addressStreet = "185 rue Duguesclin"
  addressCity = "Lyon"
  addressPostalCode = "69003"

  # Prise de RDV en ligne — laisser vide pour masquer le bouton.
  # Créer un compte sur https://calendly.com ou https://cal.com puis coller l'URL ici.
  rdvUrl = "https://consultation.avocat.fr/avocat-lyon/evanna-ientile-59497.html"

  # Formulaire de contact — laisser vide pour afficher les CTAs téléphone/email à la place.
  # Créer un compte sur https://formspree.io puis coller l'endpoint (ex: https://formspree.io/f/xxxxxxx).
  formspreeEndpoint = ""

  # Carte intégrée — iframe Google Maps. Paramètre `q` de l'URL d'embed.
  mapsQuery = "185+rue+Duguesclin,+69003+Lyon"

[Params.social]
  linkedin = "https://www.linkedin.com/in/evanna-ientile-a57b1b97/"
  email = "evanna@ientile-avocat.fr"

# Pour que le theme marche
[module]
  [[module.imports]]
    path = "github.com/caressofsteel/hugo-story"

  # Monter explicitement les dossiers locaux — nécessaire pour que le CSS custom
  # placé dans assets/ soit résolu par resources.Get.
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "data"
    target = "data"
