name: github pages

on:
  push:
    branches:
      - main  # Set a branch name to trigger deployment
  workflow_dispatch:  # Permet aussi de relancer un déploiement à la main

permissions:
  contents: write  # Nécessaire pour que l'action pousse sur la branche gh-pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for .GitInfo and .Lastmod

      # Le thème est importé en module Hugo (go.mod) : Go est requis pour le résoudre.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          extended: true
          hugo-version: '0.160.1'

      - name: Build
        run: hugo --gc --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          cname: www.ientile-avocat.fr
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
